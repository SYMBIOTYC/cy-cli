name: Quick CLI Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-14
            asset: cy-macos-x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Build release binary
        run: |
          cd .fundament/cx-rs
          cargo build --release --bin cy
      - name: Package
        run: |
          mkdir -p dist
          cp .fundament/cx-rs/target/x86_64-apple-darwin/release/cy dist/${{ matrix.asset }}
          cd dist
          tar czf ${{ matrix.asset }}.tar.gz ${{ matrix.asset }}
      - name: Upload release asset
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
