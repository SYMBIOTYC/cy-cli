name: Quick CLI Release Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            asset: cy-linux-x86_64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-latest
            asset: cy-linux-aarch64
            target: aarch64-unknown-linux-gnu
          - runner: macos-latest
            asset: cy-macos-aarch64
            target: aarch64-apple-darwin
          - runner: macos-latest
            asset: cy-macos-x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: |
          cd .fundament/cx-rs
          cargo build --release -p cy-cli --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p dist
          cp .fundament/cx-rs/target/${{ matrix.target }}/release/cy dist/${{ matrix.asset }}
          cd dist
          tar czf ${{ matrix.asset }}.tar.gz ${{ matrix.asset }}
      - name: Upload release asset
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
