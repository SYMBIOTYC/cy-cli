[package]
edition.workspace = true
license.workspace = true
name = "cx-core"
version.workspace = true

[lib]
name = "cx_core"
path = "src/lib.rs"

[[bin]]
name = "cx-write-config-schema"
path = "src/bin/config_schema.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
arc-swap = { workspace = true }
async-channel = { workspace = true }
base64 = { workspace = true }
bm25 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true, features = ["derive"] }
cx-analytics = { workspace = true }
cx-agent-graph-store = { workspace = true }
cx-api = { workspace = true }
cx-app-server-protocol = { workspace = true }
cx-apply-patch = { workspace = true }
cx-async-utils = { workspace = true }
cx-client = { workspace = true }
cx-mode = { workspace = true }
cx-connectors = { workspace = true }
cx-context-fragments = { workspace = true }
cx-config = { workspace = true }
cx-core-plugins = { workspace = true }
cx-diagnostics = { workspace = true }
cx-exec-server = { workspace = true }
cx-extension-api = { workspace = true }
cx-extension-items = { workspace = true }
cx-features = { workspace = true }
cx-feedback = { workspace = true }
cx-file-system = { workspace = true }
cx-login = { workspace = true }
cx-memories-read = { workspace = true }
cx-mcp = { workspace = true }
cx-model-provider-info = { workspace = true }
cx-models-manager = { workspace = true }
cx-shell-command = { workspace = true }
cx-execpolicy = { workspace = true }
cx-git-utils = { workspace = true }
cx-history = { workspace = true }
cx-hooks = { workspace = true }
cx-http-client = { workspace = true }
cx-install-context = { workspace = true }
cx-network-proxy = { workspace = true }
cx-otel = { workspace = true }
cx-plugin = { workspace = true }
cx-model-provider = { workspace = true }
cx-protocol = { workspace = true }
cx-response-debug-context = { workspace = true }
cx-prompts = { workspace = true }
cx-rollout = { workspace = true }
cx-rollout-trace = { workspace = true }
cx-rmcp-client = { workspace = true }
cx-sandboxing = { workspace = true }
cx-skills = { workspace = true }
cx-skills-extension = { workspace = true }
cx-state = { workspace = true }
cx-terminal-detection = { workspace = true }
cx-thread-store = { workspace = true }
cx-tools = { workspace = true }
cx-utils-absolute-path = { workspace = true }
cx-utils-audio = { workspace = true }
cx-utils-cache = { workspace = true }
cx-utils-image = { workspace = true }
cx-utils-home-dir = { workspace = true }
cx-utils-output-truncation = { workspace = true }
cx-utils-path = { workspace = true }
cx-utils-path-uri = { workspace = true }
cx-utils-plugins = { workspace = true }
cx-utils-pty = { workspace = true }
cx-utils-string = { workspace = true }
cx-utils-stream-parser = { workspace = true }
cx-windows-sandbox = { package = "cx-windows-sandbox", path = "../windows-sandbox-rs" }
dirs = { workspace = true }
dunce = { workspace = true }
eventsource-stream = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
iana-time-zone = { workspace = true }
image = { workspace = true, features = ["jpeg", "png", "webp"] }
indexmap = { workspace = true }
libc = { workspace = true }
once_cell = { workspace = true }
rand = { workspace = true }
regex-lite = { workspace = true }
rmcp = { workspace = true, default-features = false, features = [
    "base64",
    "macros",
    "schemars",
    "server",
] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha1 = { workspace = true }
shlex = { workspace = true }
similar = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
] }
tokio-util = { workspace = true, features = ["rt"] }
tokio-tungstenite = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
tracing = { workspace = true, features = ["log"] }
url = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4", "v5", "v7"] }
which = { workspace = true }
whoami = { workspace = true }

# Build OpenSSL from source for musl builds.
[target.x86_64-unknown-linux-musl.dependencies]
openssl-sys = { workspace = true, features = ["vendored"] }

# Build OpenSSL from source for musl builds.
[target.aarch64-unknown-linux-musl.dependencies]
openssl-sys = { workspace = true, features = ["vendored"] }

[target.'cfg(unix)'.dependencies]
cx-shell-escalation = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
assert_matches = { workspace = true }
cx-exec-server-test-support = { workspace = true }
cx-image-generation-extension = { workspace = true }
cx-home = { workspace = true }
cx-otel = { workspace = true }
cx-test-binary-support = { workspace = true }
cx-utils-cargo-bin = { workspace = true }
cx-web-search-extension = { workspace = true }
core_test_support = { workspace = true }
ctor = { workspace = true }
insta = { workspace = true }
maplit = { workspace = true }
opentelemetry = { workspace = true }
predicates = { workspace = true }
pretty_assertions = { workspace = true }
test-case = "3.3.1"
opentelemetry_sdk = { workspace = true, features = [
    "experimental_metrics_custom_reader",
    "metrics",
] }
serial_test = { workspace = true }
tempfile = { workspace = true }
test-log = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-test = { workspace = true, features = ["no-env-filter"] }
walkdir = { workspace = true }
wiremock = { workspace = true }
zstd = { workspace = true }

[package.metadata.cargo-shear]
ignored = ["openssl-sys"]
ignored-paths = ["tests/remote_env_windows/*.rs"]
