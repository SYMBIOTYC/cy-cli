[package]
edition.workspace = true
license.workspace = true
name = "cx-analytics"
version.workspace = true

[lib]
doctest = false
name = "cx_analytics"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
cx-app-server-protocol = { workspace = true }
cx-git-utils = { workspace = true }
cx-login = { workspace = true }
cx-model-provider = { workspace = true }
cx-plugin = { workspace = true }
cx-protocol = { workspace = true }
cx-state = { workspace = true }
os_info = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha1 = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
] }
tracing = { workspace = true, features = ["log"] }

[dev-dependencies]
cx-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
