[package]
name = "cx-mcp-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cx-mcp-server"
path = "src/main.rs"

[lib]
name = "cx_mcp_server"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
cx-arg0 = { workspace = true }
cx-config = { workspace = true }
cx-core = { workspace = true }
cx-home = { workspace = true }
cx-image-generation-extension = { workspace = true }
cx-exec-server = { workspace = true }
cx-extension-api = { workspace = true }
cx-features = { workspace = true }
cx-git-attribution = { workspace = true }
cx-login = { workspace = true }
cx-otel = { workspace = true }
cx-protocol = { workspace = true }
cx-skills-extension = { workspace = true }
cx-utils-cli = { workspace = true }
cx-utils-json-to-toml = { workspace = true }
rmcp = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
shlex = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
] }
tracing = { workspace = true, features = ["log"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

[dev-dependencies]
app_test_support = { workspace = true }
cx-utils-absolute-path = { workspace = true }
cx-shell-command = { workspace = true }
core_test_support = { workspace = true }
mcp_test_support = { workspace = true }
os_info = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
wiremock = { workspace = true }
