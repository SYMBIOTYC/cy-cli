[package]
name = "cy-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"
default-run = "cy"

[[bin]]
name = "cy"
path = "src/main.rs"

[[bin]]
name = "logs_client"
path = "src/bin/logs_client.rs"

[lib]
name = "cx_cli"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
clap_complete = { workspace = true }
cx-app-server = { workspace = true }
cx-app-server-daemon = { workspace = true }
cx-app-server-protocol = { workspace = true }
cx-app-server-test-client = { workspace = true }
cx-exec-server = { workspace = true }
cx-feedback = { workspace = true }
cx-arg0 = { workspace = true }
cx-api = { workspace = true }
cx-gt = { workspace = true }
cx-cloud-config = { workspace = true }
cx-cloud-tasks = { path = "../cloud-tasks" }
cx-utils-cli = { workspace = true }
cx-config = { workspace = true }
cx-core = { workspace = true }
cx-core-plugins = { workspace = true }
cx-history = { workspace = true }
cx-home = { workspace = true }
cx-http-client = { workspace = true }
cx-exec = { workspace = true }
cx-execpolicy = { workspace = true }
cx-extension-api = { workspace = true }
cx-features = { workspace = true }
cx-git-attribution = { workspace = true }
cx-git-utils = { workspace = true }
cx-install-context = { workspace = true }
cx-login = { workspace = true }
cx-memories-write = { workspace = true }
cx-mcp = { workspace = true }
cx-mcp-server = { workspace = true }
cx-model-provider = { workspace = true }
cx-models-manager = { workspace = true }
cx-plugin = { workspace = true }
cx-protocol = { workspace = true }
cx-responses-api-proxy = { workspace = true }
cx-rmcp-client = { workspace = true }
cx-rollout = { workspace = true }
cx-rollout-trace = { workspace = true }
cx-sandboxing = { workspace = true }
cx-skills-extension = { workspace = true }
cx-state = { workspace = true }
cx-stdio-to-uds = { workspace = true }
cx-terminal-detection = { workspace = true }
cx-thread-store = { workspace = true }
cx-tui = { workspace = true }
cx-utils-absolute-path = { workspace = true }
cx-utils-path = { workspace = true }
crossterm = { workspace = true }
http = { workspace = true }
libc = { workspace = true }
os_info = { workspace = true }
owo-colors = { workspace = true }
regex-lite = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
supports-color = { workspace = true }
sys-locale = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "time",
] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
unicode-segmentation = { workspace = true }
url = { workspace = true }
which = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
cx_windows_sandbox = { package = "cx-windows-sandbox", path = "../windows-sandbox-rs" }
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[dev-dependencies]
app_test_support = { workspace = true }
assert_cmd = { workspace = true }
assert_matches = { workspace = true }
cx-utils-cargo-bin = { workspace = true }
futures = { workspace = true }
insta = { workspace = true }
predicates = { workspace = true }
pretty_assertions = { workspace = true }
sqlx = { workspace = true }
tokio-tungstenite = { workspace = true }
wiremock = { workspace = true }
zstd = { workspace = true }

[package.metadata.cargo-shear]
# These Rust sources are intentionally Bazel-only macrobenchmarks rather than
# Cargo targets.
ignored-paths = ["e2e_benches/*.rs"]
