[package]
edition.workspace = true
license.workspace = true
name = "cx-thread-store"
version.workspace = true

[lib]
name = "cx_thread_store"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
chrono = { workspace = true, features = ["serde"] }
cx-app-server-protocol = { workspace = true }
cx-extension-items = { workspace = true }
cx-git-utils = { workspace = true }
cx-install-context = { workspace = true }
cx-otel = { workspace = true }
cx-protocol = { workspace = true }
cx-rollout = { workspace = true }
cx-state = { workspace = true }
cx-utils-absolute-path = { workspace = true }
cx-utils-path = { workspace = true }
cx-utils-path-uri = { workspace = true }
futures = { workspace = true }
pulldown-cmark = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
cx-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
uuid = { workspace = true }
