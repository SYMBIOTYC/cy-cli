[package]
edition.workspace = true
license.workspace = true
name = "cx-guardian-v2"
version.workspace = true

[lib]
name = "cx_guardian_v2"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
cx-api = { workspace = true }
cx-core = { workspace = true }
cx-extension-api = { workspace = true }
cx-features = { workspace = true }
cx-http-client = { workspace = true }
cx-login = { workspace = true }
cx-model-provider = { workspace = true }
cx-protocol = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
anyhow = { workspace = true }
cx-model-provider-info = { workspace = true }
core_test_support = { workspace = true }
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
