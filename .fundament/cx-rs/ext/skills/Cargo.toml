[package]
edition.workspace = true
license.workspace = true
name = "cx-skills-extension"
version.workspace = true

[lib]
name = "cx_skills_extension"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
cx-analytics = { workspace = true }
cx-config = { workspace = true }
cx-exec-server = { workspace = true }
cx-extension-api = { workspace = true }
cx-mcp = { workspace = true }
cx-otel = { workspace = true }
cx-protocol = { workspace = true }
cx-skills = { workspace = true }
cx-tools = { workspace = true }
cx-utils-absolute-path = { workspace = true }
cx-utils-path-uri = { workspace = true }
cx-utils-plugins = { workspace = true }
cx-utils-string = { workspace = true }
dirs = { workspace = true }
futures = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
cx-models-manager = { workspace = true }
cx-utils-cargo-bin = { workspace = true }
dunce = { workspace = true }
insta = { workspace = true }
opentelemetry_sdk = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
