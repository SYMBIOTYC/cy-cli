[package]
edition.workspace = true
license.workspace = true
name = "cx-model-provider"
version.workspace = true

[lib]
doctest = false
name = "cx_model_provider"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
cx-api = { workspace = true }
cx-agent-identity = { workspace = true }
cx-aws-auth = { workspace = true }
cx-http-client = { workspace = true }
cx-feedback = { workspace = true }
cx-login = { workspace = true }
cx-model-provider-info = { workspace = true }
cx-models-manager = { workspace = true }
cx-otel = { workspace = true }
cx-protocol = { workspace = true }
cx-response-debug-context = { workspace = true }
http = { workspace = true }
tokio = { workspace = true, features = ["process", "sync", "time"] }
tracing = { workspace = true, features = ["log"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
wiremock = { workspace = true }
