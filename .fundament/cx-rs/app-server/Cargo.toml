[package]
name = "cx-app-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cx-app-server"
path = "src/main.rs"

[[bin]]
name = "cx-app-server-test-notify-capture"
path = "src/bin/notify_capture.rs"

[[bin]]
name = "exec-server"
path = "src/bin/exec_server.rs"

[lib]
name = "cx_app_server"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
