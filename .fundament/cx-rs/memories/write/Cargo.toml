[package]
edition.workspace = true
license.workspace = true
name = "cx-memories-write"
version.workspace = true

[lib]
name = "cx_memories_write"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
cx-backend-client = { workspace = true }
cx-core = { workspace = true }
cx-config = { workspace = true }
cx-features = { workspace = true }
cx-git-utils = { workspace = true }
cx-login = { workspace = true }
cx-model-provider = { workspace = true }
cx-otel = { workspace = true }
cx-protocol = { workspace = true }
cx-rollout = { workspace = true }
cx-rollout-trace = { workspace = true }
cx-secrets = { workspace = true }
cx-state = { workspace = true }
cx-terminal-detection = { workspace = true }
cx-utils-absolute-path = { workspace = true }
cx-utils-output-truncation = { workspace = true }
cx-utils-template = { workspace = true }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt", "sync", "time"] }
tracing = { workspace = true, features = ["log"] }
uuid = { workspace = true, features = ["v4", "v5"] }

[dev-dependencies]
cx-model-provider-info = { workspace = true }
cx-models-manager = { workspace = true }
core_test_support = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros"] }
wiremock = { workspace = true }
